	var randomPairs = [];

	  if (i !== j) {
	    
	    var pair = [List_groups[i], List_groups[j]];

	      randomPairs.push(pair);
	    }

/* Judgments on group similarity */

function slugify(str) {
  return String(str)
    .trim()
    .toLowerCase()
    .replace(/\s+/g, "_")
    .replace(/[^\w]/g, "");
}

var similarity_questions = [];

for (var k = 0; k < randomPairs.length; k++) {
  var groupA = randomPairs[k][0];
  var groupB = randomPairs[k][1];

  similarity_questions.push({
    prompt: "Are <b>" + groupA + "</b> similar to <b>" + groupB + "</b>?",
    name: "pair_" + k + "__" + slugify(groupA) + "__" + slugify(groupB),
    labels: ["1<br>Not at all similar", "2", "3", "4", "5", "6", "7<br>Totally similar"],
    required: true
  });
}

var similarity_attention_item = {
  prompt: "Specifically for this item, please choose <b>Totally similar</b>.",
  name: "similarity_attention_check",
  labels: ["1<br>Not at all similar", "2", "3", "4", "5", "6", "7<br>Totally similar"],
  required: true
};

var similarity_attention_position = Math.floor(Math.random() * (similarity_questions.length + 1));
similarity_questions.splice(similarity_attention_position, 0, similarity_attention_item);

var similarity_questionnaire = {
  type: 'survey-likert',
  questions: similarity_questions,
  data: {
    task: "group_similarity"
  },
  on_finish: function(data) {
    var responses = JSON.parse(data.responses);
    var response = responses["Q" + similarity_attention_position];
    var response_value = response !== undefined && response !== null ? String(Number(response) + 1) : null;
    var result = (response_value === "7") ? "CORRECT" : "FALSE";

    data.similarity_attention = response_value;
    data.similarity_attention_result = result;
    data.similarity_attention_position = similarity_attention_position;

    jsPsych.data.addProperties({
      similarity_attention: response_value,
      similarity_attention_result: result,
      similarity_attention_position: similarity_attention_position
    });
  }
};

/* 'Please specify' function */
function makeMultiChoiceWithSpecify(config) {
  return {
    type: 'survey-multi-choice',
    questions: [{
      prompt: config.prompt,
      options: config.options,
      required: true
    }],
    button_label: config.button_label || "Continue",

    on_load: function() {
      window.scrollTo(0, 0);
      $(".jspsych-content").css("margin-top", "200px");
      $(".jspsych-content").css("max-width", "90%");

      var radioName = "jspsych-survey-multi-choice-response-0";
      var questionDiv = document.querySelector(".jspsych-survey-multi-choice-question");
      var continueBtn = document.getElementById("jspsych-survey-multi-choice-next");
      var containerId = config.data_name + "_specify_container";
      var inputId = config.data_name + "_specify";

      if (questionDiv && continueBtn && !document.getElementById(containerId)) {
        var specifyContainer = document.createElement("div");
        specifyContainer.id = containerId;
        specifyContainer.style.height = (config.reserve_height || 90) + "px";
        specifyContainer.style.marginTop = "15px";
        specifyContainer.style.visibility = "hidden";

        specifyContainer.innerHTML =
          "<label for='" + inputId + "'><b>" + (config.specify_label || "Please specify:") + "</b></label><br>" +
          "<input type='text' id='" + inputId + "' " +
          "style='width:400px; max-width:100%; padding:6px; margin-top:5px; box-sizing:border-box;'>";

        questionDiv.parentNode.insertBefore(specifyContainer, continueBtn);

        var radios = document.querySelectorAll('input[name="' + radioName + '"]');
        var input = document.getElementById(inputId);

        function shouldShow(selectedValue) {
          return config.specify_for.indexOf(selectedValue) !== -1;
        }

        function toggleSpecifyBox() {
          var selected = document.querySelector('input[name="' + radioName + '"]:checked');
          var showBox = selected && shouldShow(selected.value);

          specifyContainer.style.visibility = showBox ? "visible" : "hidden";

          if (!showBox) {
            input.value = "";
            input.setCustomValidity("");
          }
        }

        radios.forEach(function(radio) {
          radio.addEventListener("change", toggleSpecifyBox);
        });

        input.addEventListener("input", function() {
          if (input.value.trim() !== "") {
            input.setCustomValidity("");
          }
        });

        continueBtn.addEventListener("click", function(e) {
          var selected = document.querySelector('input[name="' + radioName + '"]:checked');
          var mustSpecify = selected && shouldShow(selected.value);

          if (mustSpecify && input.value.trim() === "") {
            e.preventDefault();
            e.stopImmediatePropagation();
            input.setCustomValidity(config.validation_message || "Please fill in this field.");
            input.reportValidity();
            input.focus();
            return false;
          } else {
            input.setCustomValidity("");
          }
        }, true);

        toggleSpecifyBox();
      }
    },

    on_finish: function(data) {
      var responses = JSON.parse(data.responses);
      var selectedValue = responses.Q0;
      var specifyText = "";
      var input = document.getElementById(config.data_name + "_specify");

      if (config.specify_for.indexOf(selectedValue) !== -1) {
        specifyText = input ? input.value.trim() : "";
      }

      var toSave = {};
      toSave[config.data_name] = selectedValue;
      toSave[config.data_name + "_specify"] = specifyText;

      jsPsych.data.addProperties(toSave);
    }
  };
}
